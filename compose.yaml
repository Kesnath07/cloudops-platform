# Local, production-like stack: PostgreSQL, the API container and the web console behind nginx.
#   cp .env.example .env   # then set real local values
#   docker compose up --build
# Console: http://localhost:3000   API: http://localhost:8080   Swagger UI: http://localhost:8080/swagger-ui.html

name: cloudops

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *hardening
    build:
      context: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudops
      SPRING_DATASOURCE_USERNAME: cloudops
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CLOUDOPS_JWT_SECRET: ${CLOUDOPS_JWT_SECRET:?set CLOUDOPS_JWT_SECRET in .env}
      CLOUDOPS_BOOTSTRAP_ADMIN_EMAIL: ${CLOUDOPS_BOOTSTRAP_ADMIN_EMAIL:-}
      CLOUDOPS_RELEASE: compose
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *hardening
    build:
      context: ./web
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
