version: 2

updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: [/infra, /infra/bootstrap]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/terraform-init]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
