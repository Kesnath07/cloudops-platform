name: Terraform init
description: Install Terraform and initialise the environment stack against its remote state.

inputs:
  environment:
    description: Environment directory under infra/environments (dev or prod)
    required: true
  state-bucket:
    description: S3 bucket holding Terraform state, created by the bootstrap stack
    required: true
  terraform-version:
    description: Terraform CLI version
    required: false
    default: "1.16.4"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    # Inputs are passed through the environment rather than interpolated into the script.
    - name: terraform init
      shell: bash
      working-directory: infra
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        terraform init -input=false \
          -backend-config="environments/${ENVIRONMENT}/backend.hcl" \
          -backend-config="bucket=${STATE_BUCKET}" \
          -backend-config="region=${AWS_REGION}"
